version: '3.3'

# Used by both stacks on the same host. Production leaves STACK_PREFIX, BACK_PORT
# and BOT_PORT unset and therefore keeps exactly the names and ports it has always
# had (8000 and 7000); the staging stack sets them so its containers and published
# ports don't collide. ./media, ./static and ./db-data are relative, so each stack's
# directory already gives it its own data.
#
# BACK_PORT (8000) is now published by "front" (nginx), not by "back": the server's
# nginx keeps sending the domain to :8000 exactly as before — no server changes — and
# "front" serves the React SPA + /media + /static and proxies /api, /admin, /filer to
# "back" over the compose network. "back" itself is no longer published.
services:
  back:
    container_name: ${STACK_PREFIX:-}back
    image: khtkarimzhonov/api.ser-mebel.uz:${IMAGE_TAG}
    # Not published: reached only through "front" (http://back:8000 on the network).
    expose:
      - "8000"
    environment:
      - SECRET_KEY
      - DEBUG
      - POSTGRES_DB
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_HOST
      - POSTGRES_PORT
      - BOT_TOKEN
      - BOT_SERVER
      # Optional (unset = defaults in core/settings.py).
      - CORS_ALLOWED_ORIGINS
      - JWT_ACCESS_MINUTES
      - JWT_REFRESH_DAYS
      - API_LOGIN_RATE
      # Telegram WebApp auto-login. Keep unset/0 until the bot's /start linking is
      # authenticated — see backend/CLAUDE.md.
      - TELEGRAM_WEBAPP_LOGIN_ENABLED
    command: sh prodserver.sh
    volumes:
      - ./media/:/media/
      - ./static/:/static/

  front:
    container_name: ${STACK_PREFIX:-}front
    image: khtkarimzhonov/front.ser-mebel.uz:${IMAGE_TAG}
    ports:
      - "${BACK_PORT:-8000}:80"
    volumes:
      # Read-only: written by "back" (uploads, collectstatic), served here by nginx.
      - ./media/:/media/:ro
      - ./static/:/static/:ro
    depends_on:
      - back

  bot:
    container_name: ${STACK_PREFIX:-}bot
    image: khtkarimzhonov/bot.ser-mebel.uz:${IMAGE_TAG}
    ports:
      - "${BOT_PORT:-7000}:80"
    environment:
      - DEBUG
      - BOT_TOKEN
      - WEBHOOK_URL
      - BASE_SITE
      - POSTGRES_DB
      - POSTGRES_HOST
      - POSTGRES_USER
      - POSTGRES_PASSWORD
    command: sh -c "uvicorn main:app --host 0.0.0.0 --port 80 --workers 4"

  db:
    container_name: ${STACK_PREFIX:-}db
    image: postgres:18
    environment:
      - POSTGRES_DB
      - POSTGRES_USER
      - POSTGRES_PASSWORD
    volumes:
      - ./db-data:/var/lib/postgresql
