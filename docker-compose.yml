version: '3.3'

services:
  back:
    container_name: back
    build: ./backend
    ports:
      - 8000:8000
    env_file:
      - ./backend/.env
    command: bash ./runserver.sh
    volumes:
      - ./media/:/media/
      - ./static/:/static/
      - ./backend/:/app/
    depends_on:
      - db

  # Background + periodic tasks (Celery). Schedule: backend/accounting/schedule.py.
  celery-worker:
    container_name: celery-worker
    build: ./backend
    env_file:
      - ./backend/.env
    command: celery -A core worker -l info
    volumes:
      - ./media/:/media/
      - ./backend/:/app/
    depends_on:
      - db
      - redis

  celery-beat:
    container_name: celery-beat
    build: ./backend
    env_file:
      - ./backend/.env
    command: celery -A core beat -l info
    volumes:
      - ./backend/:/app/
    depends_on:
      - db
      - redis

  redis:
    container_name: redis
    image: redis:7-alpine

  db: 
    container_name: db
    image: postgres:18
    env_file:
      - ./backend/.env
    volumes:
      - ./db-data:/var/lib/postgresql

  # React SPA (frontend/). Vite proxies /api, /media, /admin to the back service.
  front:
    container_name: front
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      - VITE_BACKEND_URL=http://back:8000
    ports:
      - 5173:5173
    volumes:
      - ./frontend/:/app/
    depends_on:
      - back
