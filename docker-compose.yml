version: '3.3'

services:
  back:
    container_name: back
    build: ./backend
    ports:
      - 8000:8000
    env_file:
      - ./backend/.env
    command: bash ./runserver.sh
    volumes:
      - ./media/:/media/
      - ./static/:/static/
      - ./backend/:/app/
    depends_on:
      - db

  # Moliya scheduled jobs (reminders, reports). Optional in dev.
  scheduler:
    container_name: scheduler
    build: ./backend
    env_file:
      - ./backend/.env
    command: python manage.py finance_scheduler
    volumes:
      - ./media/:/media/
      - ./backend/:/app/
    depends_on:
      - db

  db: 
    container_name: db
    image: postgres:18
    env_file:
      - ./backend/.env
    volumes:
      - ./db-data:/var/lib/postgresql

  # React SPA (frontend/). Vite proxies /api, /media, /admin to the back service.
  front:
    container_name: front
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      - VITE_BACKEND_URL=http://back:8000
    ports:
      - 5173:5173
    volumes:
      - ./frontend/:/app/
    depends_on:
      - back
