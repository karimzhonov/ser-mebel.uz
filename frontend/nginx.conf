# Single entry point of the stack (container "front"):
#   /            -> the React SPA (this image)
#   /api/ /admin/ /filer/ -> Django ("back" service on the compose network)
#   /media/ /static/      -> straight from disk (./media, ./static mounted read-only)
#
# In prod it sits behind the server's own nginx (TLS), which still points at :8000.
# Whatever that nginx put in the headers (scheme, host, client IP) is passed on
# unchanged, so Django sees the same request it saw before "front" existed.

map $http_x_forwarded_proto $sm_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Client IP for the API login throttle: X-Real-IP from the server nginx, else the
# first X-Forwarded-For entry, else the direct peer.
map $http_x_forwarded_for $sm_xff_first {
    "~^\s*([^,\s]+)" $1;
    default            $remote_addr;
}
map $http_x_real_ip $sm_client_ip {
    default $http_x_real_ip;
    ""      $sm_xff_first;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 200m;

    root /usr/share/nginx/html;
    index index.html;

    proxy_set_header Host              $http_host;
    proxy_set_header X-Forwarded-Proto $sm_forwarded_proto;
    proxy_set_header X-Forwarded-Host  $http_x_forwarded_host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP         $sm_client_ip;
    proxy_read_timeout 120s;

    location /api/   { proxy_pass http://back:8000; }
    location /admin/ { proxy_pass http://back:8000; }
    location /filer/ { proxy_pass http://back:8000; }

    location /static/ {
        alias /static/;
        expires 7d;
        access_log off;
    }

    location /media/ {
        alias /media/;
        # Uploaded files must never run as the app (the SPA keeps tokens in localStorage).
        add_header Content-Security-Policy "default-src 'none'; script-src 'none'; object-src 'self'; img-src 'self'; media-src 'self'; style-src 'unsafe-inline'" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Hashed build assets can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # "/?telegram_id=…" is the old Telegram -> admin login view (oauth/views.py);
    # keep sending it to Django. Plain "/" is the SPA.
    location = / {
        if ($arg_telegram_id) {
            proxy_pass http://back:8000;
        }
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # Client-side routes (/orders/12 …) all serve the SPA shell.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
