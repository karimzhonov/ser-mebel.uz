# Single entry point of the stack (container "front"):
#   /            -> the React SPA (this image)
#   /api/ /admin/ /filer/ -> Django ("back" service on the compose network)
#   /media/ /static/      -> straight from disk (./media, ./static mounted read-only)
#
# In prod it sits behind the server's own nginx (TLS). Keep the scheme and client IP
# that nginx already put in the headers, otherwise Django thinks every request is
# plain http (CSRF failures in /admin/) and the API login throttle sees one IP.

map $http_x_forwarded_proto $sm_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 200m;

    root /usr/share/nginx/html;
    index index.html;

    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Proto $sm_forwarded_proto;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_read_timeout 120s;

    location /api/   { proxy_pass http://back:8000; }
    location /admin/ { proxy_pass http://back:8000; }
    location /filer/ { proxy_pass http://back:8000; }

    location /static/ {
        alias /static/;
        expires 7d;
        access_log off;
    }

    location /media/ {
        alias /media/;
        # Uploaded files must never run as the app (the SPA keeps tokens in localStorage).
        add_header Content-Security-Policy "default-src 'none'; script-src 'none'; object-src 'self'; img-src 'self'; media-src 'self'; style-src 'unsafe-inline'" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Hashed build assets can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/orders/12 …) all serve the SPA shell.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
